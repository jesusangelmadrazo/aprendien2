services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: clasedrive
      POSTGRES_PASSWORD: clasedrive
      POSTGRES_DB: clasedrive
    ports:
      - "5433:5432"
    volumes:
      - clasedrive_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  clasedrive_pg_data:
